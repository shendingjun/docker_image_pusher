name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    # 关键改动 1：锁定 24.04。ubuntu-latest 正在迁移到 Ubuntu 26，
    # 旧版 maximize-build-space / service docker restart 在新镜像上很容易炸。
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        # v5 起 runs.using: node24，可消除 "Node.js 20 is deprecated" 警告
        uses: actions/checkout@v5

      # 关键改动 2：先校验 4 个 Secret，把"登录失败"和"拉取失败"区分开
      - name: Check secrets
        run: |
          set +e
          miss=0
          for k in ALIYUN_REGISTRY ALIYUN_NAME_SPACE ALIYUN_REGISTRY_USER ALIYUN_REGISTRY_PASSWORD; do
            if [ -z "${!k:-}" ]; then
              echo "::error::Secret $k 未配置或为空，请在 Settings -> Secrets and variables -> Actions 里补上"
              miss=1
            fi
          done
          echo "registry=[$ALIYUN_REGISTRY] namespace=[$ALIYUN_NAME_SPACE] user=[$ALIYUN_REGISTRY_USER]"
          exit $miss

      # 这个 workflow 只用 docker pull/tag/push，不需要 buildx，
      # 原来的 docker/setup-buildx-action@v3 既用不上、又是 Node20 警告的来源，直接去掉。
      # 以后要做多架构 build 再加回来（那时请用 @v4，它是 node24）。

      - name: Login Aliyun
        run: |
          set -e
          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login "$ALIYUN_REGISTRY" -u "$ALIYUN_REGISTRY_USER" --password-stdin

      # 关键改动 3：去掉 maximize-build-space（新版 runner 空闲 60G+，一般不需要它，
      # 它反而是最常见的"挂载失败/磁盘满"元凶）。镜像总量确实超过 40G 时再打开注释。
      # - name: Maximize build space
      #   uses: easimon/maximize-build-space@master
      #   with:
      #     root-reserve-mb: 2048
      #     swap-size-mb: 128
      #     remove-dotnet: 'true'
      #     remove-haskell: 'true'
      #     build-mount-path: '/var/lib/docker/'
      # - name: Restart docker
      #   run: sudo service docker restart

      # 关键改动 4：逐条拉取，单条失败不中断，最后汇总报错，日志里直接指出是哪一行
      - name: Build and push image Aliyun
        run: |
          set +e
          set -uo pipefail

          echo "=== 磁盘 ==="; df -hT / ; echo

          declare -A duplicate_images
          declare -A temp_map

          # ---------- 第一遍：判断镜像重名 ----------
          while IFS= read -r raw || [ -n "$raw" ]; do
            line="$(printf '%s' "$raw" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac

            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag="${image##*/}"
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name="${image_name_tag%%:*}"

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
              if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                echo "duplicate image name: $image_name"
                duplicate_images[$image_name]="true"
              fi
            else
              temp_map[$image_name]="$name_space"
            fi
          done < images.txt

          # ---------- 第二遍：拉取 / 重打标签 / 推送 ----------
          ok_list=()
          fail_list=()

          while IFS= read -r raw || [ -n "$raw" ]; do
            line="$(printf '%s' "$raw" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac

            read -r -a parts <<< "$line"
            image="${parts[$((${#parts[@]}-1))]}"
            platform=""
            for p in "${parts[@]}"; do
              case "$p" in --platform=*) platform="${p#--platform=}" ;; esac
            done
            if [ -z "$platform" ] && [[ "$line" =~ --platform[[:space:]]+([^[:space:]]+) ]]; then
              platform="${BASH_REMATCH[1]}"
            fi

            echo "::group::$image"
            echo "docker pull $image   platform=[${platform}]"

            pulled=0
            for attempt in 1 2 3; do
              if [ -n "$platform" ]; then
                docker pull --platform "$platform" "$image" && { pulled=1; break; }
              else
                docker pull "$image" && { pulled=1; break; }
              fi
              echo "第 $attempt 次拉取失败，5s 后重试..."
              sleep 5
            done

            if [ "$pulled" -ne 1 ]; then
              echo "::error::docker pull 失败: $image"
              echo "常见原因：1) 镜像/tag 不存在  2) 私有仓库需要登录  3) 该 tag 不支持 $platform 架构"
              fail_list+=("$image")
              echo "::endgroup::"
              continue
            fi

            # 目标镜像名
            image_name_tag="${image##*/}"
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name="${image_name_tag%%:*}"

            platform_prefix=""
            if [ -n "$platform" ]; then platform_prefix="${platform//\//_}_"; fi

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" ]] && [ -n "$name_space" ]; then
              name_space_prefix="${name_space}_"
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            echo "docker tag $image $new_image"
            if ! docker tag "$image" "$new_image"; then
              echo "::error::docker tag 失败: $new_image"
              fail_list+=("$image (tag)")
              echo "::endgroup::"
              continue
            fi

            echo "docker push $new_image"
            if ! docker push "$new_image"; then
              echo "::error::docker push 失败: $new_image"
              fail_list+=("$image (push)")
              echo "::endgroup::"
              continue
            fi

            ok_list+=("$new_image")
            docker rmi "$image" >/dev/null 2>&1 || true
            docker rmi "$new_image" >/dev/null 2>&1 || true
            df -hT / | tail -1
            echo "::endgroup::"
          done < images.txt

          echo "==================== 结果汇总 ===================="
          echo "成功: ${#ok_list[@]} 个"
          for i in "${ok_list[@]:-}"; do [ -n "$i" ] && echo "  OK   $i"; done
          echo "失败: ${#fail_list[@]} 个"
          for i in "${fail_list[@]:-}"; do
            [ -n "$i" ] && echo "  FAIL $i" && echo "::error::$i 处理失败"
          done
          echo "================================================="

          [ "${#fail_list[@]}" -eq 0 ] || exit 1
